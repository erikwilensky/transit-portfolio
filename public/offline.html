<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#002855" />
<title>Offline · NIST Transit Portfolio</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #1b1f2a; --muted: #5b6272; --navy: #002855; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1420; --ink: #eef1f6; --muted: #a7afbf; --navy: #7fa6d9; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px 16px; text-align: center; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 8px 0 0; }
  p { margin: 0; color: var(--muted); max-width: 30ch; }
  button { margin-top: 12px; font: inherit; font-weight: 600; color: #fff; background: #002855; border: 0; border-radius: 10px; padding: 12px 22px; min-height: 48px; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="" />
  <h1>You're offline.</h1>
  <p>Your moments will be here when you're back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
